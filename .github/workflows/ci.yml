name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        shell: bash
        run: |
          set -e
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install || true
          fi

      - name: Install Python dependencies (if present)
        shell: bash
        run: |
          set -e
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt || true
          fi
          if [ -f app/applet/app/bie/requirements.txt ]; then
            pip install -r app/applet/app/bie/requirements.txt || true
          fi

      - name: Run tests (npm test preferred, fallback to pytest)
        shell: bash
        run: |
          set -e
          if npm run test --silent; then
            echo "npm test passed"
          else
            echo "npm test failed or not present — attempting pytest directly"
            if [ -d app/applet/app/bie/tests ]; then
              PYTHONPATH=app/applet/app/bie python3 -m pytest app/applet/app/bie/tests -v || true
            else
              echo "No pytest tests found at app/applet/app/bie/tests — skipping"
            fi
          fi

      - name: Build (attempt)
        shell: bash
        run: |
          set -e
          npm run build --silent || echo "npm run build failed or is not applicable"

      - name: Start server (background) and smoke test
        shell: bash
        run: |
          set -e
          # Start Node server in background and capture logs
          nohup npm start &> bie_server.log & echo $! > bie_server.pid || true

          # Wait for server to respond on /api/manifest
          for i in $(seq 1 30); do
            sleep 1
            if curl --fail --silent http://localhost:3000/api/manifest > /dev/null; then
              echo "Server responded"
              break
            fi
            echo "Waiting for server... ($i)"
          done

          echo "---- Last 200 lines of bie_server.log ----"
          tail -n 200 bie_server.log || true

      - name: Smoke-check API (full output)
        shell: bash
        run: |
          set -e
          echo "Manifest response:" || true
          curl --fail --show-error --silent http://localhost:3000/api/manifest || true
